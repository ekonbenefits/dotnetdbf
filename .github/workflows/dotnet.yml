name: Build .net core

on: [push]

jobs:
  build:
    name: Test ${{ matrix.os }} for dotnet ${{ matrix.dotnet }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        dotnet: [ '10.0.x' ]
        os: [ubuntu-latest, macOS-latest]
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
    - name: Build with dotnet core
      run: dotnet build --configuration Release
    - name: Tests
      run: dotnet test DotNetDBF.Test/DotNetDBF.Test.csproj --configuration Release -f net10.0 --no-build --no-restore

  # Line and branch coverage of the two library projects, on one platform - the numbers do not
  # differ per OS, so measuring on each of them would be waste.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test with coverage
        run: |
          dotnet test DotNetDBF.Test/DotNetDBF.Test.csproj --configuration Release -f net10.0 \
            --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Summarise
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:'coverage/**/coverage.cobertura.xml' -targetdir:coverage/report \
            -reporttypes:'Cobertura;MarkdownSummaryGithub;Html' \
            -assemblyfilters:'+DotNetDBF;+DotNetDBF.Enumerable'
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/report
